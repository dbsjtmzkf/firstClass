<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../font/css/notosanskr.css">
    <link rel="stylesheet" href="login.css">
    <title>Netflix 로그인</title>
</head>
<body>
    <div id="wrap">
        <header>
            <a href="#" class="logo" aria-label="Netflix 홈">NETFLIX</a>
        </header>

        <main>
            <section class="login">
                <h1 class="login_title">로그인</h1>

                <form action="">
                    <fieldset>
                        <legend class="sr-only">Netflix 로그인</legend>

                        <div class="input_box">
                            <label for="email">이메일 주소 또는 휴대폰 번호</label>
                            <input
                                type="text"
                                id="email"
                                name="email"
                                autocomplete="username"
                                placeholder="이메일 주소 또는 휴대폰 번호"
                            >
                        </div>

                        <div class="input_box">
                            <label for="password">비밀번호</label>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                autocomplete="current-password"
                                placeholder="비밀번호"
                            >
                        </div>

                        <button type="submit" class="login_btn">로그인</button>

                        <div class="login_option">
                            <label>
                                <input type="checkbox" name="remember" class="sr-only">
                                <span>로그인 정보 저장</span>
                            </label>
                            <a href="#">도움이 필요하신가요?</a>
                        </div>
                    </fieldset>
                </form>

                <div class="signup">
                    <p>Netflix 회원이 아니신가요?</p>
                    <a href="#">지금 가입하세요.</a>
                </div>

                <p class="recaptcha">
                    이 페이지는 Google reCAPTCHA의 보호를 받아 사용자가 로봇이 아님을 확인합니다.
                </p>
            </section>
        </main>

        <footer>
            <a href="#">고객 지원</a>
            <a href="#">이용 약관</a>
            <a href="#">개인정보 처리방침</a>
            <a href="#">쿠키 설정</a>
        </footer>
    </div>
</body>
</html>
