<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>처갓집리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-brand">
                <a href="#" class="brand-logo" aria-label="처갓집양념치킨 홈">처갓집<span>양념치킨</span></a>
            </div>
            <nav class="main-nav" aria-label="주요 메뉴">
                <a href="#">메뉴안내</a>
                <a href="#">처갓집소개</a>
                <a href="#">처돌이카</a>
                <a href="#">매장안내</a>
                <a href="#">해외매장</a>
                <a href="#">웹진</a>
                <a href="#">창업안내</a>
            </nav>
        </header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/visual101.png" alt="치킨배너1" class="pc">
                            <img src="img/m_visual101.png" alt="모바일치킨배너1" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual102.png" alt="치킨배너2" class="pc">
                            <img src="img/m_visual102.png" alt="모바일치킨배너2" class="mo">
                        </div>
                            ...
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- If we need scrollbar -->
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,

            // If we need pagination
            pagination: {
                el: '.visual .swiper-pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            // And if we need scrollbar
            scrollbar: {
                el: '.visual .swiper-scrollbar',
            },
        });
    </script>
</body>
</html>
