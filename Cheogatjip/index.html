<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>처갓집리뉴얼포트폴리오</title>
    <link rel="stylesheet" href="../css/default.css">
    <link rel="stylesheet" href="../npm/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="../font/css/pretendardvariable.css">
    <link rel="stylesheet" href="css/main.css">
    <script src="../npm/swiper/swiper-bundle.min.js"></script>
</head>
<body>
    <div id="wrap">
        <header class="site-header">
            <div class="header-inner">
                <a href="#" class="brand-logo" aria-label="처갓집양념치킨 홈">
                    <img src="img/처갓집%20로고.png" alt="처갓집양념치킨">
                </a>
                <nav class="main-nav" aria-label="주요 메뉴">
                    <a href="#">메뉴안내</a>
                    <a href="#">처갓집소개</a>
                    <a href="#">처돌이야</a>
                    <a href="#">매장안내</a>
                    <a href="#">해외매장</a>
                    <a href="#">웹진</a>
                    <a href="#">창업안내</a>
                </nav>
            </div>
        </header>
        <main>
            <div class="hero-sec">
                <!-- Slider main container -->
                <div class="swiper visual">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                        <div class="swiper-slide">
                            <img src="img/visual101.png" alt="치킨배너1" class="pc">
                            <img src="img/m_visual101.png" alt="모바일치킨배너1" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual102.png" alt="치킨배너2" class="pc">
                            <img src="img/m_visual102.png" alt="모바일치킨배너2" class="mo">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual_201.png" alt="치킨배너3" class="pc">
                        </div>
                        <div class="swiper-slide">
                            <img src="img/visual_202.png" alt="새로워진 처갓집 멤버십앱 홍보 배너" class="pc">
                        </div>
                    </div>
                    <!-- If we need pagination -->
                    <div class="swiper-pagination"></div>

                    <!-- If we need navigation buttons -->
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-button-next"></div>

                    <!-- If we need scrollbar -->
                    <div class="swiper-scrollbar"></div>
                </div>
            </div>
            <section class="home-section menu-feature" aria-labelledby="menu-feature-title">
                <div class="section-heading">
                    <p class="section-eyebrow">CHEOGAJIP MENU</p>
                    <h2 id="menu-feature-title">추천, 신메뉴, 인기메뉴</h2>
                    <p>지금 처갓집에서 만나보세요</p>
                </div>
                <img class="section-image menu-feature-image" src="img/Screenshot%202026-10-14%20112213_edited%201.png" alt="처갓집 추천 메뉴와 신메뉴 안내">
            </section>

            <section class="home-section webzine-section" aria-labelledby="webzine-title">
                <div class="section-heading">
                    <p class="section-eyebrow">CHEOGAJIP STORY</p>
                    <h2 id="webzine-title">처갓집 웹진</h2>
                </div>
                <img class="section-image" src="img/image%2020.png" alt="처갓집 웹진 콘텐츠">
            </section>

            <section class="home-section store-section" aria-labelledby="store-title">
                <div class="section-heading">
                    <p class="section-eyebrow">FIND A STORE</p>
                    <h2 id="store-title">매장안내</h2>
                </div>
                <img class="section-image" src="img/image%2019.png" alt="처갓집 매장 안내 콘텐츠">
            </section>

            <section class="home-section app-section" aria-labelledby="app-title">
                <div class="section-heading">
                    <p class="section-eyebrow">CHEOGAJIP APP</p>
                    <h2 id="app-title">처갓집 APP</h2>
                    <p>간편하게 메뉴를 주문하고 다양한 혜택을 만나보세요.</p>
                </div>
                <div class="app-section-images">
                    <img src="img/image%2022.png" alt="처갓집 앱 소개">
                    <img src="img/image%2021.png" alt="처갓집 앱 주문 안내">
                </div>
            </section>
        </main>
        <footer>&copy;</footer>
    </div>
    <script>
        const swiper = new Swiper('.hero-sec > .swiper', {
            // Optional parameters
            direction: 'horizontal',
            loop: true,

            // If we need pagination
            pagination: {
                el: '.visual .swiper-pagination',
            },

            // Navigation arrows
            navigation: {
                nextEl: '.visual .swiper-button-next',
                prevEl: '.visual .swiper-button-prev',
            },

            // And if we need scrollbar
            scrollbar: {
                el: '.visual .swiper-scrollbar',
            },
        });
    </script>
</body>
</html>
