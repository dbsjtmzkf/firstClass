<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/default.css">
    <title>버거킹</title>
    <style>
       :root {
            --font: "Sandoll GothicNeoRound", sans-serif;
            --font-pre: "Pretendard Variable", sans-serif;
            --font-BKR: "BKR", sans-serif;
            --primary:#512314;
            --disabledBg:#DDCDBE;
            --focus:#D62302;
            --baseBorder:#D9CFC6;
            --baseBg:#FFFcf9;
            --button:#E9DDCD;
            --errorColor:#C54734;
            --placehokder:#EBE6E2;
            --text:#766053;
            --bg:#F4EBDC;
            --inputBg:#FFFCF9;
       }
       html {
        font-size: 62.5%;
       }
       body {
            font-family: var(--font);
            font-weight: 300;
            font-size: 1.6rem;
       }
       #wrap {
        width: 100%;
        max-width: 1024px;
        min-width: 360px;
        min-height: 100dvb;
        margin: 0 auto;
        background-color: var(--bg);
       }
       header {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
       }
       .prev_btn {
        position: absolute;
        left: 0;
        width: 48px;
        height: 48px;
        background: url(img/back_icon.svg) no-repeat scroll center / auto;
       }
       h1 {
        font-size: 2.0rem;
       }
       main {
        padding: 20px 20px 90px;
       }
       .title {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-bottom: 50px;
        font-family: var(--font-BKR);
       }
       .title span:first-child {
        font-size: 2.5rem;
        line-height: 1;
       }
       .title > span:last-child {
        font-size: 3.5rem;
        line-height: 1;
       }
       input {
        border: 1px solid var(--baseBorder);
        background-color: var(--inputBg);
       }
       input[type="password"] {
        width: 100%;
        height: 50px;
        padding: 0 58px 0 20px;
        border-radius: 10px;
       }
       .input_box.rela {
        position: relative;
       }
       .pw_btn {
        position: absolute;
        right: 20px;
        bottom: 12px;
        width: 26px;
        height: 26px;
        background: url(img/eye_icon.svg) no-repeat center/26px;
       }
       .password_input + .password_input {
        margin-top: 12px;
       }
       .password_error {
        margin-top: 8px;
        font-family: var(--font-pre);
        font-size: 1.3rem;
        color: var(--errorColor);
       }
       .password_rule {
        margin-top: 24px;
        font-family: var(--font-pre);
        font-size: 1.3rem;
        color: var(--text);
       }
       .password_rule li + li {
        margin-top: 4px;
       }
       .password_rule li::before {
        content: "•";
        margin-right: 5px;
       }
       .password_notice {
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid rgba(81, 35, 20, 0.2);
        font-family: var(--font-pre);
        font-size: 1.3rem;
        color: var(--text);
       }
       .sns_notice {
        margin-top: 40px;
        font-family: var(--font-pre);
        font-size: 1.3rem;
        color: var(--text);
        text-align: center;
       }
       .login_btn {
        width: 100%;
        height: 44px;
        margin-top: 30px;
        border-radius: 22px;
        font-family: inherit;
        font-size: inherit;
        color: var(--placehokder);
        background-color: var(--primary);
        border: none;
        opacity: 0.2;
       }
    </style>
</head>
<body>
    <div id="wrap">
        <header>
            <h1>비밀번호 재설정</h1>
            <button type="button" class="prev_btn"><span class="sr-only">이전버튼</span></button>
        </header>
        <main>
            <h2 class="title">
                <span>새로운 비밀번호를</span>
                <span>입력해 주세요</span>
            </h2>
            <form action="">
                <fieldset>
                    <legend class="sr-only">비밀번호 재설정</legend>
                    <div class="input_box rela password_input">
                        <label for="password" class="sr-only">새 비밀번호</label>
                        <input type="password" id="password" name="password" placeholder="새로운 비밀번호를 입력해 주세요.">
                        <button type="button" class="pw_btn"><span class="sr-only">비밀번호 보기</span></button>
                    </div>
                    <div class="input_box rela password_input">
                        <label for="password_confirm" class="sr-only">새 비밀번호 확인</label>
                        <input type="password" id="password_confirm" name="password_confirm" placeholder="비밀번호를 한 번 더 입력해 주세요.">
                        <button type="button" class="pw_btn"><span class="sr-only">비밀번호 보기</span></button>
                    </div>
                    <ul class="password_rule">
                        <li>최소 8글자 이상 최대 20글자</li>
                        <li>영어 대/소문자, 숫자, 특수문자 중 3개 이상 조합</li>
                        <li>아이디와 동일한 비밀번호 사용 불가</li>
                    </ul>
                    <p class="password_notice">동일한 문자나 숫자를 반복해서 사용하거나 쉽게 추측할 수 있는 숫자는 사용하지 않는 것을 권장합니다.</p>
                    <p class="sns_notice">SNS 계정으로 가입한 경우 비밀번호 재설정이 불가능합니다.</p>
                    <button type="submit" class="login_btn">완료</button>
                </fieldset>
            </form>
        </main>
    </div>
</body>
</html>
